name: app-cd-example

on:
  workflow_dispatch:

jobs:
  platform-provisioning:
    uses: ./.github/workflows/reusable-terraform.yml
    with:
      tf_working_dir: terraform/environments/staging/cicd
      environment: staging
      plan_only: false
    secrets:
      azure_client_id: ${{ secrets.AZURE_CLIENT_ID_STAGING }}
      azure_tenant_id: ${{ secrets.AZURE_TENANT_ID_STAGING }}
      azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID_STAGING }}

  app-deploy:
    runs-on: ubuntu-latest
    needs: platform-provisioning
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy application workload
        run: echo "Deploy app after Terraform provisioning completes"
